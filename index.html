<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fodbold tilmelding</title>

  <!-- Behold hele din CSS uændret her -->
</head>

<body>
  <!-- Behold hele din HTML uændret, men ret input-felterne sådan her: -->

  <input type="text" id="barnNavn" name="barnNavn" required>
  <input type="date" id="fodselsdato" name="fodselsdato" required>
  <input type="text" id="foralderNavn" name="foralderNavn" required>
  <input type="email" id="email" name="email" required>
  <input type="tel" id="telefon" name="telefon" required>

  <select id="hold" name="hold" required>
    <option value="">Vælg hold</option>
    <option>Børnehave</option>
    <option>Børnehaveklasse-1. klasse</option>
    <option>2. klasse - 3. klasse</option>
  </select>

  <textarea id="kommentar" name="kommentar" placeholder="Skriv evt. en kommentar her"></textarea>

  <!-- Udskift KUN dit nederste <script>...</script> med dette: -->

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzfqV2Qtcnru1rb2xQ_k1v3Gka6T7QAVGmrudvWIcPPngKzZa98eZYE37twTdMp69Ei/exec";

    const form = document.getElementById("tilmeldingForm");
    const errorBoks = document.getElementById("errorBoks");
    const statusBoks = document.getElementById("statusBoks");
    const copyButton = document.getElementById("copyButton");
    const copyStatus = document.getElementById("copyStatus");
    const sendButton = document.getElementById("sendButton");
    const successModal = document.getElementById("successModal");
    const sendingModal = document.getElementById("sendingModal");
    const okButton = document.getElementById("okButton");

    copyButton.addEventListener("click", async function () {
      try {
        await navigator.clipboard.writeText("97575");
        copyStatus.style.display = "block";
        copyStatus.textContent = "MobilePay-nummer kopieret";
        setTimeout(() => {
          copyStatus.style.display = "none";
        }, 2500);
      } catch (err) {
        copyStatus.style.display = "block";
        copyStatus.textContent = "Kunne ikke kopiere automatisk. Nummeret er: 97575";
      }
    });

    function visModal() {
      successModal.style.display = "flex";
    }

    function skjulModal() {
      successModal.style.display = "none";
    }

    function visSenderModal() {
      sendingModal.style.display = "flex";
    }

    function skjulSenderModal() {
      sendingModal.style.display = "none";
    }

    okButton.addEventListener("click", function () {
      skjulModal();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    successModal.addEventListener("click", function (e) {
      if (e.target === successModal) {
        skjulModal();
      }
    });

    form.addEventListener("submit", async function(e) {
      e.preventDefault();

      errorBoks.style.display = "none";
      statusBoks.style.display = "none";
      sendButton.disabled = true;
      visSenderModal();

      const formData = new FormData(form);

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          body: formData,
          mode: "no-cors"
        });

        skjulSenderModal();
        sendButton.disabled = false;
        form.reset();
        visModal();

      } catch (error) {
        skjulSenderModal();
        sendButton.disabled = false;
        errorBoks.style.display = "block";
        errorBoks.textContent = "Der opstod en fejl ved afsendelse. Prøv igen.";
      }
    });
  </script>
</body>
</html>
