<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tilmelding</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    padding:20px;
}

.card{
    max-width:650px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,0.12);
}

h1{
    text-align:center;
    margin-top:0;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input,
textarea{
    width:100%;
    padding:14px;
    margin-top:6px;
    box-sizing:border-box;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    margin-top:25px;
    padding:18px;
    border:none;
    border-radius:12px;
    background:#2e7d32;
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:0.6;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.popup{
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    width:90%;
    max-width:400px;
}

.spinner{
    width:50px;
    height:50px;
    border:6px solid #ddd;
    border-top:6px solid #2e7d32;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:auto;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

#success{
display:none;
margin-top:20px;
padding:15px;
background:#e8f5e9;
border-radius:12px;
text-align:center;
font-weight:bold;
color:#1b5e20;
}
</style>

</head>
<body>

<div class="card">

<h1>Tilmelding</h1>

<form id="myForm">

<label>Navn</label>
<input name="navn" required>

<label>Telefon</label>
<input name="telefon">

<label>Email</label>
<input name="email" type="email">

<label>Besked</label>
<textarea name="besked"></textarea>

<button type="submit">
Send tilmelding
</button>

</form>

<div id="success">
Tak 😊 Din tilmelding er sendt.
</div>

</div>

<div class="overlay" id="overlay">
<div class="popup">

<div class="spinner"></div>

<h2>Sender...</h2>

<p>
Vent venligst mens tilmeldingen sendes.
Luk ikke siden.
</p>

</div>
</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzfqV2Qtcnru1rb2xQ_k1v3Gka6T7QAVGmrudvWIcPPngKzZa98eZYE37twTdMp69Ei/exec";

const form=document.getElementById("myForm");

form.addEventListener("submit",async(e)=>{

e.preventDefault();

document.getElementById("overlay").style.display="flex";

const data=new FormData(form);

try{

await fetch(
SCRIPT_URL,
{
method:"POST",
body:data,
mode:"no-cors"
}
);

document.getElementById("overlay").style.display="none";

document.getElementById("success").style.display="block";

form.reset();

}
catch(err){

document.getElementById("overlay").style.display="none";

alert("Fejl ved afsendelse");

}

});

</script>

</body>
</html>
