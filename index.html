<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Fodbold tilmelding</title>

<style>

body{
font-family:Arial,sans-serif;
max-width:760px;
margin:0 auto;
padding:20px;
background:#f4f7fb;
color:#1f2937;
}

.card{
background:white;
padding:24px;
border-radius:16px;
box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

h1{
margin-top:0;
margin-bottom:10px;
font-size:30px;
}

h2{
margin-top:28px;
margin-bottom:10px;
font-size:20px;
color:#0b63ce;
}

p{
line-height:1.5;
}

.intro{
background:#eef5ff;
border-left:4px solid #0b63ce;
padding:14px;
margin-bottom:20px;
border-radius:8px;
}

.payment-box{
background:#f8fafc;
border:1px solid #dbe3ee;
padding:16px;
border-radius:12px;
margin-top:12px;
}

.payment-number{
font-size:28px;
font-weight:bold;
margin:8px 0 14px 0;
letter-spacing:1px;
}

label{
display:block;
margin-top:14px;
font-weight:bold;
}

input,
select,
textarea,
button{
width:100%;
padding:12px;
margin-top:6px;
border:1px solid #cbd5e1;
border-radius:10px;
box-sizing:border-box;
font-size:16px;
}

textarea{
min-height:90px;
resize:vertical;
}

button{
background:#0b63ce;
color:white;
border:none;
cursor:pointer;
margin-top:22px;
font-weight:bold;
}

.copy-button{
background:#16a34a;
margin-top:8px;
}

.copy-status{
display:none;
margin-top:10px;
font-size:14px;
color:#166534;
font-weight:bold;
}

.modal-backdrop{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.45);
z-index:9999;
align-items:center;
justify-content:center;
padding:20px;
}

.modal{
background:white;
width:100%;
max-width:420px;
border-radius:16px;
padding:24px;
text-align:center;
}

.spinner{
width:46px;
height:46px;
border:5px solid #dbeafe;
border-top:5px solid #0b63ce;
border-radius:50%;
margin:0 auto 18px auto;
animation:spin 1s linear infinite;
}

@keyframes spin{
from{
transform:rotate(0deg);
}
to{
transform:rotate(360deg);
}
}

</style>

</head>

<body>

<div class="card">

<h1>
IF Bjørn - Fodbold tilmelding
</h1>

<div class="intro">

<strong>
Velkommen til tilmelding
</strong>

<br><br>

Kontingent:

300 kr pr år.

</div>

<form id="tilmeldingForm">

<h2>
Barnets oplysninger
</h2>

<label>
Barnets fulde navn
</label>

<input
id="barnNavn"
required>

<label>
Fødselsdato
</label>

<input
type="date"
id="fodselsdato"
required>

<h2>
Forælder
</h2>

<label>
Forælders navn
</label>

<input
id="foralderNavn"
required>

<label>
E-mail
</label>

<input
type="email"
id="email"
required>

<label>
Telefon
</label>

<input
id="telefon"
required>

<h2>
Hold
</h2>

<select id="hold" required>

<option value="">
Vælg hold
</option>

<option>
Børnehave
</option>

<option>
Børnehaveklasse-1. klasse
</option>

<option>
2. klasse - 3. klasse
</option>

</select>

<label>
Kommentar
</label>

<textarea
id="kommentar">
</textarea>

<div class="payment-box">

MobilePay:

<div class="payment-number">

97575

</div>

<button
type="button"
class="copy-button"
id="copyButton">

Kopiér nummer

</button>

<div
class="copy-status"
id="copyStatus">

Kopieret

</div>

</div>

<button
type="submit"
id="sendButton">

Send tilmelding

</button>

</form>

</div>

<div
class="modal-backdrop"
id="sendingModal">

<div class="modal">

<div class="spinner">

</div>

<h2>
Sender...
</h2>

</div>

</div>

<div
class="modal-backdrop"
id="successModal">

<div class="modal">

<h2>

Tilmelding modtaget

</h2>

<p>

Husk MobilePay:
97575

</p>

<button
id="okButton">

OK

</button>

</div>

</div>

<script>

const SCRIPT_URL=
"https://script.google.com/macros/s/AKfycbzfqV2Qtcnru1rb2xQ_k1v3Gka6T7QAVGmrudvWIcPPngKzZa98eZYE37twTdMp69Ei/exec";

const form=
document.getElementById(
"tilmeldingForm"
);

form.addEventListener(
"submit",
async function(e){

e.preventDefault();

document
.getElementById(
"sendingModal"
)
.style.display="flex";

const data=
new URLSearchParams();

data.append(
"barnNavn",
document.getElementById(
"barnNavn"
).value
);

data.append(
"fodselsdato",
document.getElementById(
"fodselsdato"
).value
);

data.append(
"foralderNavn",
document.getElementById(
"foralderNavn"
).value
);

data.append(
"email",
document.getElementById(
"email"
).value
);

data.append(
"telefon",
document.getElementById(
"telefon"
).value
);

data.append(
"hold",
document.getElementById(
"hold"
).value
);

data.append(
"kommentar",
document.getElementById(
"kommentar"
).value
);

await fetch(
SCRIPT_URL,
{
method:"POST",
body:data,
headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},
mode:"no-cors"
}
);

document
.getElementById(
"sendingModal"
)
.style.display="none";

document
.getElementById(
"successModal"
)
.style.display="flex";

form.reset();

});

document
.getElementById(
"okButton"
)
.onclick=
function(){

document
.getElementById(
"successModal"
)
.style.display=
"none";

};

</script>

</body>
</html>
